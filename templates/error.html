<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error {{ code }} | APNPS Admin Portal</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
