{% extends "base.html" %}
{% block title %}Edit Teacher{% endblock %}
{% block header %}Edit Teacher / Staff{% endblock %}
{% block content %}

<div class="panel narrow">
  <div class="panel-head">
    <h3>Edit Staff Record</h3>
    <a href="{{ url_for('salary.teacher_salary_detail', teacher_id=t.id) }}" class="link-btn">Manage Salary &rarr;</a>
  </div>
  <form method="POST" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <label>Full Name</label>
      <input type="text" name="name" value="{{ t.name }}" required>
    </div>
    <div class="form-row">
      <label>Subject / Role</label>
      <input type="text" name="subject" value="{{ t.subject or '' }}" placeholder="e.g. English, Admin Staff">
    </div>
    <div class="form-row">
      <label>Contact Number</label>
      <input type="text" name="contact" value="{{ t.contact or '' }}">
    </div>
    <div class="form-row">
      <label>Joining Date</label>
      <input type="date" name="joining_date" value="{{ t.joining_date or '' }}">
    </div>

    <div class="form-actions">
      <button type="submit" class="submit-btn">Update Staff Member</button>
      <a href="{{ url_for('teachers.teachers') }}" class="cancel-link">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
