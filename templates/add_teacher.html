{% extends "base.html" %}
{% block title %}Add Teacher{% endblock %}
{% block header %}Add Teacher / Staff{% endblock %}
{% block content %}

<div class="panel narrow">
  <h3>New Staff Record</h3>
  <form method="POST" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <label>Full Name</label>
      <input type="text" name="name" required>
    </div>
    <div class="form-row">
      <label>Subject / Role</label>
      <input type="text" name="subject" placeholder="e.g. English, Admin Staff">
    </div>
    <div class="form-row">
      <label>Contact Number</label>
      <input type="text" name="contact">
    </div>
    <div class="form-row">
      <label>Joining Date</label>
      <input type="date" name="joining_date">
    </div>
    <hr>
    <p class="section-label">Salary Structure (optional, can edit later)</p>
    <div class="form-row">
      <label>Monthly Salary (₹)</label>
      <input type="number" step="0.01" name="monthly_salary" placeholder="0.00">
    </div>

    <div class="form-actions">
      <button type="submit" class="submit-btn">Save Staff Member</button>
      <a href="{{ url_for('teachers') }}" class="cancel-link">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
