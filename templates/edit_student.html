{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block header %}Edit Student{% endblock %}
{% block content %}

<div class="panel">
  <div class="panel-head">
    <h3>Edit Student Record</h3>
    <a href="{{ url_for('fees.student_fee_detail', student_id=s.id) }}" class="link-btn">Manage Fee &rarr;</a>
  </div>
  <form method="POST" class="form-grid-2col">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <label>Full Name</label>
      <input type="text" name="name" value="{{ s.name }}" required>
    </div>
    <div class="form-row">
      <label>Roll No</label>
      <input type="text" name="roll_no" value="{{ s.roll_no }}" required>
    </div>
    <div class="form-row">
      <label>Class</label>
      <select name="class_name" required>
        <option value="" disabled>Choose a class&hellip;</option>
        {% for c in class_choices %}
          <option value="{{ c }}" {{ 'selected' if s.class_name == c }}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label>Section</label>
      <select name="section" required>
        <option value="" disabled>Choose a section&hellip;</option>
        {% for sec in section_choices %}
          <option value="{{ sec }}" {{ 'selected' if s.section == sec }}>{{ sec }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label>Date of Birth</label>
      <input type="date" name="dob" value="{{ s.dob or '' }}">
    </div>
    <div class="form-row">
      <label>Admission Date</label>
      <input type="date" name="admission_date" value="{{ s.admission_date or '' }}">
    </div>
    <div class="form-row">
      <label>Parent / Guardian Name</label>
      <input type="text" name="parent_name" value="{{ s.parent_name or '' }}">
    </div>
    <div class="form-row">
      <label>Contact Number</label>
      <input type="text" name="contact" value="{{ s.contact or '' }}">
    </div>
    <div class="form-row full-width">
      <label>Address</label>
      <input type="text" name="address" value="{{ s.address or '' }}" placeholder="e.g. 12 Gandhi Street, Salem">
    </div>

    <div class="form-actions">
      <button type="submit" class="submit-btn">Update Student</button>
      <a href="{{ url_for('students.students') }}" class="cancel-link">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
