{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block header %}Add Student{% endblock %}
{% block content %}

<div class="panel narrow">
  <div class="panel-head">
    <h3>New Student Record</h3>
    <a href="{{ url_for('import_students') }}" class="link-btn">Adding many at once? Use CSV import &rarr;</a>
  </div>
  <form method="POST" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <label>Full Name</label>
      <input type="text" name="name" required>
    </div>
    <div class="form-row">
      <label>Class</label>
      <select name="class_name" required>
        <option value="" disabled selected>Choose a class&hellip;</option>
        {% for c in class_choices %}
          <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label>Roll No</label>
      <input type="text" name="roll_no" required>
    </div>
    <div class="form-row">
      <label>Parent / Guardian Name</label>
      <input type="text" name="parent_name">
    </div>
    <div class="form-row">
      <label>Contact Number</label>
      <input type="text" name="contact">
    </div>
    <div class="form-row">
      <label>Address</label>
      <input type="text" name="address" placeholder="e.g. 12 Gandhi Street, Salem">
    </div>
    <div class="form-row">
      <label>Admission Date</label>
      <input type="date" name="admission_date">
    </div>
    <hr>
    <p class="section-label">Fee Structure (optional, can edit later)</p>
    <div class="form-row">
      <label>Total Fee for the Year (₹)</label>
      <input type="number" step="0.01" min="0" name="total_fee" placeholder="0.00">
    </div>
    <div class="form-row">
      <label>Fee Due Date</label>
      <input type="date" name="due_date">
    </div>

    <div class="form-actions">
      <button type="submit" class="submit-btn">Save Student</button>
      <a href="{{ url_for('students') }}" class="cancel-link">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
